{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gameboxd{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700;800;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'pages/style.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="page-shell">
        <header class="site-header">
            <a class="brand" href="{% url 'home' %}">
                <span class="brand-mark">G</span>
                <span class="brand-text">Gameboxd</span>
            </a>

            <nav class="site-nav" aria-label="Primary navigation">
                <a href="{% url 'home' %}">Home</a>
                <a href="{% url 'search' %}">Games</a>
                <a href="{% url 'search' %}">Search</a>
            </nav>

            <a class="nav-cta" href="{% url 'search' %}">Find a game</a>
        </header>

        <main>
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
