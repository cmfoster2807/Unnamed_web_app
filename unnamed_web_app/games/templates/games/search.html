<!DOCTYPE html>
<html>
<head>
    <title>Search Games</title>
</head>
<body>
    <h1>Search Games</h1>

    <form method="GET" action="{% url 'search' %}">
        <input type="text" name="q" value="{{ query }}" placeholder="Search for a game...">
        <button type="submit">Search</button>
    </form>

    {% if results %}
        <ul>
            {% for game in results %}
                <li>
                    {% if game.cover %}
                        <img src="https:{{ game.cover.url }}" alt="{{ game.name }}">
                    {% endif %}
                    <a href="{% url 'game_detail' game.id %}">{{ game.name }}</a>
                </li>
            {% endfor %}
        </ul>
    {% elif query %}
        <p>No results found for "{{ query }}"</p>
    {% endif %}
</body>
</html>
